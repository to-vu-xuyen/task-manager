name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          
          MYSQL_DATABASE: task_manager_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd:"mysqladmin ping --silent"
          --health-interval:10s
          --health-timeout:5s
          --health-retries:5

      redis:
        image: redis:8
        ports:
          - 6379:6379

    env:
      APP_ENV: test
      
      DB_HOST: localhost
      DB_PORT: 3306
      DB_NAME: task_manager
      DB_USERNAME: root
      DB_PASSWORD:
      DB_CHARSET: utf8mb4
      DB_COLLATION: utf8mb4_unicode_ci

      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci_dummy_secret

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_mysql, redis
          coverage: xdebug

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot && break
            sleep 1
          done

      - name: Run migrations
        run: php yii migrate --interactive:0

      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse -c phpstan.neon

      - name: Code style check (php-cs-fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run tests (PHPUnit)
        run: vendor/bin/phpunit --configuration phpunit.xml --coverage-text --colors:never
